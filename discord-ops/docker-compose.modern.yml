# DayZ Discord Ops - Application Stack
# Control Plane: dedi-ops (agent.mildlyawesome.com:35100)
# This stack deploys application services only; agent/Traefik/etc. live in dedi-ops

services:
  # DayZ Discord Bot
  dayz-bot:
    image: python:3.12-slim
    container_name: dayz_bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DEDI_OPS_API_URL=http://host.docker.internal:35100
      - DEDI_OPS_API_KEY=${DEDI_OPS_API_KEY:-}
    command: >
      sh -c "pip install --no-cache-dir discord.py httpx pydantic && python -m src.bot"
    networks:
      - dayz_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MildlyAwesome API (CHRONOS-enabled)
  mildlyawesome-api:
    image: python:3.12-slim
    container_name: mildlyawesome_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEDI_OPS_API_URL=http://host.docker.internal:35100
      - DEDI_OPS_API_KEY=${DEDI_OPS_API_KEY:-}
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn[standard] httpx pydantic orjson && uvicorn src.mildlyawesome.api:app --host 0.0.0.0 --port 8080 --log-level info"
    ports:
      - "8080:8080"
    networks:
      - dayz_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Application Redis (session/cache for DayZ bot)
  redis:
    image: redis:alpine
    container_name: dayz_app_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dayz_net

networks:
  dayz_net:
    driver: bridge

volumes:
  redis_data:

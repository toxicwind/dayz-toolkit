[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-discord-ops"
version = "1.0.0"
description = "DayZ Discord Operations Bot"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9.0",
    "python-valve>=0.2.1",
    "python-a2s>=1.3.0",
    "Pillow>=10.0.0",
    "lxml>=4.9.0",
    "websockets>=12.0",
    "mysql-connector-python>=8.0.0",
    "prometheus-client>=0.17.0",
    "pymysql>=1.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "PyNaCl>=1.5.0",
    "watchdog>=3.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
]
    
[tool.setuptools]
packages = ["src.mildlyawesome", "src.modules", "tools"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    "vendor",
    "dashboard/.next",
    "backend_data",
    "server/ezstreet",
    "logs",
    "tools/dayz_admin_suite",
    "tools/test_discord_channels.py",
    "tools/verify_file_access.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "ASYNC", "A", "C4", "PIE"]
ignore = ["ANN", "D"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

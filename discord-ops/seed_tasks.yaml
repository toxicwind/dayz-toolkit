---
tasks:
  - key: unlimited_stamina
    title: "Unlimited stamina"
    priority: P0
    status: ready
    scope: >-
      Raise or disable stamina drain so survivors can sprint continuously on the live server without
      mods or admin commands.
    surface: >-
      cfggameplay.json > PlayerData > StaminaData (maxStamina, staminaDepletionSpeed, regen settings)
      plus serverDZ.cfg enableCfgGameplay flag.
    acceptance: >-
      After a restart, a fresh character can sprint with 8+ kg inventory for five minutes with no
      exhaustion while server console logs show the cfgGameplay override loading without errors.
    owner:
  - key: fresh_spawn_loadout
    title: "Fresh spawn loadout"
    priority: P1
    status: ready
    scope: >-
      Ship a curated fresh spawn preset so new characters begin with radio, food, and starter tools
      without relying on random CLE pulls.
    surface: >-
      missions/<terrain>/db/spawnPresets/*.json preset files referenced by cfggameplay.json
      PlayerData.spawnGearPresetFiles.
    acceptance: >-
      Two consecutive fresh spawns receive identical defined gear and server script logs confirm the
      preset JSON file loaded successfully.
    owner:
  - key: build_anywhere
    title: "Build anywhere"
    priority: P0
    status: ready
    scope: >-
      Re-enable base building in problem areas by disabling hologram placement restrictions while
      keeping exploit checks off only where needed.
    surface: >-
      cfggameplay.json > BaseBuildingData > HologramData (disableBaseBuildingRestrictions,
      disableIsCollidingBBoxCheck, disableIsCollidingPlayerCheck).
    acceptance: >-
      QA can place a fence kit on uneven rocks behind Black Market without "Cannot place object"
      and server logs show cfggameplay applied for the active mission.
    owner:
  - key: map_position_direction
    title: "Fix map position/direction"
    priority: P0
    status: ready
    scope: >-
      Ensure all players can open the map and see their position/heading regardless of owning a
      physical map item.
    surface: >-
      cfggameplay.json > MapData (ignoreMapOwnership, displayPlayerPosition, displayMapStats,
      reduceMapItemLockouts per-terrain as needed).
    acceptance: >-
      After restart, pressing `M` on a new spawn shows the player arrow and bearing overlay on the
      in-game map for both Chernarus and any hosted DLC terrains.
    owner:
  - key: pristine_loot_policy
    title: "Pristine loot policy"
    priority: P1
    status: ready
    scope: >-
      Define whether all CLE loot spawns pristine or within a tight damage band so gear feels fresh
      without breaking balance.
    surface: >-
      globals.xml <damage> settings (lootMinDamage, lootMaxDamage) plus validation script/output
      included in tooling.
    acceptance: >-
      Five random world spawns inspected via admin camera all show 100% health and automated
      validation run logs the configured global bounds before restart.
    owner:
  - key: remove_bad_loot
    title: "Remove pox/chemlight/xmas loot"
    priority: P1
    status: ready
    scope: >-
      Eliminate undesired clutter items (cannabis buds, pox injectors, chemlights, cargo nets, Xmas
      lights) from the economy so they never spawn from CLE.
    surface: >-
      db/types.xml entries for the specified classnames (nominal, min, usage, category) plus
      mapgrouppos overrides if required.
    acceptance: >-
      CLE preview or community economy viewer shows each listed classname with nominal 0 and no
      active events after reload; live loot sweep finds none.
    owner:
  - key: add_curated_loot
    title: "Add MJ packs / cigs / keys"
    priority: P1
    status: ready
    scope: >-
      Introduce MJ packs, cigarette packs, and container keys with sane spawn rates to support new

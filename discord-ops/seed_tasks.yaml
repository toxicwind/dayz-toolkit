    surface: >-
      db/types.xml additions for each classname plus usage/category tags and, if needed,
      events.xml hooks for special key containers.
    acceptance: >-
      CLE dump shows new classnames with expected nominal counts and a 10-minute admin sweep finds at
      least one of the new items per class.
    owner:
  - key: cars_spawn_complete

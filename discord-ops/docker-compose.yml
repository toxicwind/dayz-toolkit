services:
  bot:
    build: .
    container_name: mildlyawesome_bot
    restart: unless-stopped
    ports:
      - "43300:43200"
      - "43301:9110"
    environment:
      - CONFIG_SERVICE=ezstreet
      - CONFIG_ENV=dev
      - NEXT_PUBLIC_API_URL=http://localhost:43300
      - DISABLE_FTP_PUSH=1
      - ENABLE_SELFPLAY=true
      - PYTHONUNBUFFERED=1
      - DISCORD_TOKEN=${EZSTREET_DISCORD_TOKEN}
    volumes:
      - .:/app
      - ./config:/config:ro
      - ./state:/app/state
      - ./logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:43200/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mildlyawesome_net

  dashboard:
    build:
      context: ./dashboard/mildlyawesome_dashboard
      dockerfile: Dockerfile
    container_name: mildlyawesome_dashboard
    restart: unless-stopped
    ports:
      - "43302:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:43302
      - BACKEND_URL=http://mildlyawesome_bot:43200
      - WATCHPACK_POLLING=true
    volumes:
      - ./dashboard/mildlyawesome_dashboard:/app
      - /app/node_modules
    networks:
      - mildlyawesome_net
    depends_on:
      - bot
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    container_name: mildlyawesome_redis
    restart: unless-stopped
    ports:
      - "43303:6379"
    networks:
      - mildlyawesome_net

  mysql:
    image: mysql:8.0
    container_name: mildlyawesome_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dayz_ops
      MYSQL_USER: dayz
      MYSQL_PASSWORD: ${EZSTREET_MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "43304:3306"
    networks:
      - mildlyawesome_net

networks:
  mildlyawesome_net:
    driver: bridge

volumes:
  mysql_data:

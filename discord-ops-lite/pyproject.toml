[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-discord-ops"
version = "0.1.0"
description = "Discord bot for DayZ ops: A2S query + BattlEye RCON + stat channels"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "python-dotenv>=1.0.1",
  "python-a2s>=1.3.0",
  "rcon>=2.4.6",
  "prometheus-client>=0.20.0",
  "pydantic>=2.8.0",
  "pymysql>=1.1.1",
  "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0","pytest-asyncio>=0.24.0","ruff>=0.6.0","mypy>=1.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

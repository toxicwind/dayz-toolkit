services:
  dayz-discord-bot:
    build:
      context: .
    image: dayz-discord-ops:latest
    container_name: dayz-discord-bot
    env_file:
      - .env
    environment:
      DAYZ_MYSQL_HOST: ${DAYZ_MYSQL_HOST:-mysql}
      METRICS_PORT: ${METRICS_PORT:-9108}
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
      - "${PUBLIC_HTTPS_PORT:-8443}:8443"
      - "${METRICS_PORT:-9108}:9108"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: dayz-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DAYZ_MYSQL_PASS}
      MYSQL_DATABASE: ${DAYZ_MYSQL_DB}
      MYSQL_USER: ${DAYZ_MYSQL_USER}
      MYSQL_PASSWORD: ${DAYZ_MYSQL_PASS}
    ports:
      - "${DAYZ_MYSQL_PORT:-3306}:3306"
    volumes:
      - dayz_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: dayz-dashboard:dev
    restart: unless-stopped
    command: npm run dev
    ports:
      - "${DASHBOARD_PORT:-18787}:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      DAYZ_MYSQL_HOST: ${DAYZ_MYSQL_HOST:-mysql}
      DAYZ_MYSQL_DB: ${DAYZ_MYSQL_DB}
      DAYZ_MYSQL_USER: ${DAYZ_MYSQL_USER}
      DAYZ_MYSQL_PASS: ${DAYZ_MYSQL_PASS}
      DAYZ_MYSQL_PORT: ${DAYZ_MYSQL_PORT:-3306}

volumes:
  dayz_mysql_data:
